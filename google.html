<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Logowanie Google – Śliska News</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#555;background:#f4f5f7;text-align:center;padding:0 20px}a{color:#d6001c;font-weight:600}@media(prefers-color-scheme:dark){body{background:#151517;color:#bbb}}</style></head>
<body><p id="t">Logowanie…</p>
<script>
(function () {
  var t = document.getElementById('t');
  var h = new URLSearchParams(location.hash.slice(1));
  var msg = { type: 'sliska-google', id_token: h.get('id_token') || '', state: h.get('state') || '', error: h.get('error') || '' };
  var home = location.hostname === 'news.sliska.pl' ? '/' : '/news/';
  /* 1) Okienko (komputer): oddaj token stronie, która je otworzyła. */
  try { if (window.opener && window.opener !== window) { window.opener.postMessage(msg, location.origin); setTimeout(function () { window.close(); }, 200); return; } } catch (e) { /* dalej */ }
  /* 2) Przekierowanie (telefon / aplikacja): zaloguj tutaj i wróć do portalu. */
  var saved = null; try { saved = JSON.parse(localStorage.getItem('sliska_g') || 'null'); localStorage.removeItem('sliska_g'); } catch (e) { /* ignoruj */ }
  var back = (saved && saved.r && saved.r.indexOf(location.origin) === 0) ? saved.r : home;
  function fail(text) { t.innerHTML = text + '<br><br><a href="' + back + '">Wróć do Śliskiej News</a>'; }
  if (!msg.id_token) { fail(msg.error === 'access_denied' ? 'Logowanie anulowane.' : 'Logowanie przerwane.'); return; }
  if (!saved || saved.n !== msg.state) { fail('Logowanie wygasło – spróbuj ponownie.'); return; }
  var api = location.hostname === 'news.sliska.pl' ? 'https://api.sliska.pl' : '/news/api';
  fetch(api + '/auth/google', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: msg.id_token }), cache: 'no-store' })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || !d.token) throw new Error(d.error || 'http'); return d; }); })
    .then(function (d) { try { localStorage.setItem('sliska_session', d.token); } catch (e) { /* ignoruj */ } t.textContent = 'Zalogowano. Wracam do portalu…'; location.replace(back); })
    .catch(function () { fail('Nie udało się zalogować przez Google.'); });
})();
</script></body></html>
